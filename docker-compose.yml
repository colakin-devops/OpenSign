services:
  mongo:
    image: mongo:latest
    container_name: dex-sign-mongo
    restart: unless-stopped
    volumes:
      - data-volume:/data/db
    networks:
      - app-network

  server:
    image: opensign/opensignserver:main
    container_name: OpenSignServer-container
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - opensign-files:/usr/src/app/files
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      SERVER_URL: https://dex-sign.colakin.com/api/app
      PUBLIC_URL: https://dex-sign.colakin.com
      PARSE_MOUNT: /app
    depends_on:
      - mongo
    networks:
      - app-network

  client:
    image: opensign/opensign:main
    container_name: OpenSign-container
    restart: unless-stopped
    ports:
      - "127.0.0.1:13000:3000"
    env_file:
      - .env.prod
    depends_on:
      - server
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  data-volume:
  opensign-files:
